# Supabase CLI configuration for local development.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "kitchen-pantry"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_recipes.sql"]

[studio]
enabled = true
port = 54323

# Local email inbox for magic links / confirmations (local development only):
# Supabase CLI v3 calls this section [local_smtp] and turns it on by default,
# so it isn't configured here. The CLI prints its address when you run
# `supabase start`.

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "kitchenpantry://auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
double_confirm_changes = true
# Off for local development so you can sign in immediately. Turn on in production.
enable_confirmations = false
